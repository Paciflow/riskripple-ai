[project]
name = "riskripple"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "pydantic>=2",
    "networkx",
    "rapidfuzz",
    "boto3",
    "strands-agents",
    "strands-agents-tools",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
